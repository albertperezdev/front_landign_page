<header class="bg-unidad text-white">
  <div class="mx-auto flex max-w-7xl items-center gap-4 px-4 py-5 sm:gap-6 sm:px-8 sm:py-6">
    <div
      class="flex size-16 shrink-0 flex-col items-center justify-center rounded-lg bg-ods text-tinta sm:size-20"
      role="img"
      aria-label="Objetivo de Desarrollo Sostenible 5"
    >
      <span class="text-xs font-extrabold tracking-wide" aria-hidden="true">ODS</span>
      <span class="text-3xl leading-none font-black sm:text-4xl" aria-hidden="true">5</span>
    </div>
    <div class="flex-1">
      <p class="text-2xl font-black sm:text-3xl">TEIG</p>
      <p class="text-sm sm:text-lg">Tecnología Educativa para la Igualdad de Género</p>
    </div>
    <button
      type="button"
      class="cursor-pointer rounded-lg border-2 border-white px-4 py-2 font-extrabold transition-colors duration-150 ease-out hover:bg-white hover:text-unidad"
      (click)="auth.cerrarSesion()"
    >
      Cerrar sesión
    </button>
  </div>
</header>

<main class="mx-auto w-full max-w-7xl flex-1 px-4 py-8 sm:px-8 lg:py-14">
  <h1 class="text-3xl font-black text-balance sm:text-4xl lg:text-5xl">
    Hola, {{ auth.usuario()?.name }}
  </h1>
  <p class="mt-5 max-w-[60ch] text-lg leading-relaxed text-tinta-suave">
    Ya entraste a TEIG con {{ auth.usuario()?.email }}. Pronto encontrarás aquí los contenidos sobre
    igualdad de género.
  </p>
</main>
